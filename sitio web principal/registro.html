<body>
    <h1>Registro de datos personales</h1>
<form>
    <label for="name">Nombre:</label>
    <input type="text" id="name" placeholder="Nombre">
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Email">
    <label for="phone">Telefono:</label>
    <input type="tel" id="phone" placeholder="Telefono">
    <label for="birthdate">Fecha de nacimiento:</label>
    <input type="date" id="birthdate" placeholder="Fecha de nacimiento">
    <label for="address">Direccion:</label>
    <textarea id="address" placeholder="Direccion"></textarea>
<select>

    <option value="mujer">Mujer</option>
    <option value="hombre">Hombre</option>



</select>



     <select>
        <option value="santa-fe">Santa Fe</option>
        <option value="Ceibo">Ciudad Ceibo</option>
        <option value="quisqueya">Ciudad Quisqueya</option>
        
    </select>
    <button type="submit">Registrar</button>
    <input type="checkbox" id="hobby1">
    <label for="hobby1">Jugar videojuegos competitivos en PC</label>
    <input type="checkbox" id="hobby2">
    <label for="hobby2">Optimizar computadoras y aprender informática</label>
    <input type="checkbox" id="hobby3">
    <label for="hobby3">Hacer ejercicio y mantenerme activo</label>
    <input type="checkbox" id="hobby4">
    <label for="hobby4">Ver series y documentales de neurociencia, y aprender sobre como ser un mentalista</label>

   
</form>
